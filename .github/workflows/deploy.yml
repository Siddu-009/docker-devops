
name: ZEDA Docker CI/CD

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 995938832906.dkr.ecr.us-east-1.amazonaws.com

  BACKEND_REPOSITORY: swiggy-backend-v2
  FRONTEND_REPOSITORY: swiggy-frontend
  NGINX_REPOSITORY: swiggy-nginx-v2

jobs:

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build Backend
        run: |
          docker build \
            -t $ECR_REGISTRY/$BACKEND_REPOSITORY:$IMAGE_TAG \
            ./backend

      - name: Build Frontend
        run: |
          docker build \
            -t $ECR_REGISTRY/$FRONTEND_REPOSITORY:$IMAGE_TAG \
            ./frontend

      - name: Build Nginx
        run: |
          docker build \
            -t $ECR_REGISTRY/$NGINX_REPOSITORY:$IMAGE_TAG \
            ./nginx

      - name: Push Backend
        run: |
          docker push \
            $ECR_REGISTRY/$BACKEND_REPOSITORY:$IMAGE_TAG

      - name: Push Frontend
        run: |
          docker push \
            $ECR_REGISTRY/$FRONTEND_REPOSITORY:$IMAGE_TAG

      - name: Push Nginx
        run: |
          docker push \
            $ECR_REGISTRY/$NGINX_REPOSITORY:$IMAGE_TAG
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    needs: build-and-push

    steps:

      - name: Deploy application
        uses: appleboy/ssh-action@v1.0.3

        env:
          IMAGE_TAG: ${{ github.sha }}

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          envs: IMAGE_TAG

          script: |

            set -e

            cd /opt/zeda

            SHORT_TAG="${IMAGE_TAG:0:7}"

            echo "========================================"
            echo "Starting ZEDA deployment"
            echo "Commit: ${SHORT_TAG}"
            echo "========================================"

            echo "Logging in to Amazon ECR..."

            aws ecr get-login-password \
              --region us-east-1 | \
              docker login \
              --username AWS \
              --password-stdin \
              995938832906.dkr.ecr.us-east-1.amazonaws.com

            export BACKEND_IMAGE="995938832906.dkr.ecr.us-east-1.amazonaws.com/swiggy-backend-v2:${SHORT_TAG}"

            export FRONTEND_IMAGE="995938832906.dkr.ecr.us-east-1.amazonaws.com/swiggy-frontend:${SHORT_TAG}"

            export NGINX_IMAGE="995938832906.dkr.ecr.us-east-1.amazonaws.com/swiggy-nginx-v2:${SHORT_TAG}"

            echo "========================================"
            echo "Images to deploy"
            echo "========================================"

            echo "Backend : $BACKEND_IMAGE"
            echo "Frontend: $FRONTEND_IMAGE"
            echo "Nginx   : $NGINX_IMAGE"

            echo "========================================"
            echo "Compose configuration"
            echo "========================================"

            docker-compose config | grep image

            echo "========================================"
            echo "Pulling new images"
            echo "========================================"

            docker compose pull

            echo "========================================"
            echo "Starting containers"
            echo "========================================"

            docker compose up -d --remove-orphans --force-recreate

            echo "========================================"
            echo "Waiting for health checks"
            echo "========================================"

            sleep 20

            docker compose ps

            echo "========================================"
            echo "Checking backend"
            echo "========================================"

            BACKEND_CONTAINER=$(docker-compose ps -q backend)

            BACKEND_STATUS=$(docker inspect "$BACKEND_CONTAINER" \
              --format='{{.State.Health.Status}}')

            echo "Backend status: $BACKEND_STATUS"

            if [ "$BACKEND_STATUS" != "healthy" ]; then
              echo "❌ Backend deployment failed"
              docker compose logs --tail=100 backend
              exit 1
            fi

            echo "✅ Backend healthy"

            echo "========================================"
            echo "Checking frontend"
            echo "========================================"

            FRONTEND_CONTAINER=$(docker-compose ps -q frontend)

            FRONTEND_STATUS=$(docker inspect "$FRONTEND_CONTAINER" \
              --format='{{.State.Health.Status}}')

            echo "Frontend status: $FRONTEND_STATUS"

            if [ "$FRONTEND_STATUS" != "healthy" ]; then
              echo "❌ Frontend deployment failed"
              docker-compose logs --tail=100 frontend
              exit 1
            fi

            echo "✅ Frontend healthy"

            echo "========================================"
            echo "Checking nginx"
            echo "========================================"

            NGINX_CONTAINER=$(docker-compose ps -q nginx)

            NGINX_STATUS=$(docker inspect "$NGINX_CONTAINER" \
              --format='{{.State.Health.Status}}')

            echo "Nginx status: $NGINX_STATUS"

            if [ "$NGINX_STATUS" != "healthy" ]; then
              echo "❌ Nginx deployment failed"
              docker-compose logs --tail=100 nginx
              exit 1
            fi

            echo "✅ Nginx healthy"

            echo "========================================"
            echo "Testing application"
            echo "========================================"

            curl -f http://localhost/api/health

            echo ""

            echo "========================================"
            echo "✅ ZEDA deployment successful!"
            echo "========================================"
