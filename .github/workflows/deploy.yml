
name: ZEDA Docker CI/CD

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 995938832906.dkr.ecr.us-east-1.amazonaws.com

  BACKEND_REPOSITORY: swiggy-backend-v2
  FRONTEND_REPOSITORY: swiggy-frontend
  NGINX_REPOSITORY: swiggy-nginx-v2

jobs:

  # ============================================================
  # JOB 1 - BUILD AND PUSH IMAGES TO ECR
  # ============================================================

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------

      - name: Checkout source code
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Configure AWS
      # ----------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ----------------------------------------------------------
      # Login to ECR
      # ----------------------------------------------------------

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ----------------------------------------------------------
      # Create image tag
      # ----------------------------------------------------------

      - name: Set image tag
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"

          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

          echo "========================================"
          echo "Image tag: $IMAGE_TAG"
          echo "========================================"

      # ----------------------------------------------------------
      # Build Backend
      # ----------------------------------------------------------

      - name: Build Backend Image
        run: |
          echo "Building backend image..."

          docker build \
            -t "$ECR_REGISTRY/$BACKEND_REPOSITORY:$IMAGE_TAG" \
            ./backend

      # ----------------------------------------------------------
      # Build Frontend
      # ----------------------------------------------------------

      - name: Build Frontend Image
        run: |
          echo "Building frontend image..."

          docker build \
            -t "$ECR_REGISTRY/$FRONTEND_REPOSITORY:$IMAGE_TAG" \
            ./frontend

      # ----------------------------------------------------------
      # Build Nginx
      # ----------------------------------------------------------

      - name: Build Nginx Image
        run: |
          echo "Building nginx image..."

          docker build \
            -t "$ECR_REGISTRY/$NGINX_REPOSITORY:$IMAGE_TAG" \
            ./nginx

      # ----------------------------------------------------------
      # Push Backend
      # ----------------------------------------------------------

      - name: Push Backend Image
        run: |
          echo "Pushing backend image..."

          docker push \
            "$ECR_REGISTRY/$BACKEND_REPOSITORY:$IMAGE_TAG"

      # ----------------------------------------------------------
      # Push Frontend
      # ----------------------------------------------------------

      - name: Push Frontend Image
        run: |
          echo "Pushing frontend image..."

          docker push \
            "$ECR_REGISTRY/$FRONTEND_REPOSITORY:$IMAGE_TAG"

      # ----------------------------------------------------------
      # Push Nginx
      # ----------------------------------------------------------

      - name: Push Nginx Image
        run: |
          echo "Pushing nginx image..."

          docker push \
            "$ECR_REGISTRY/$NGINX_REPOSITORY:$IMAGE_TAG"

      # ----------------------------------------------------------
      # Verify images
      # ----------------------------------------------------------

      - name: Verify images in ECR
        run: |
          echo "========================================"
          echo "Verifying ECR images"
          echo "========================================"

          aws ecr describe-images \
            --repository-name "$BACKEND_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG"

          aws ecr describe-images \
            --repository-name "$FRONTEND_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG"

          aws ecr describe-images \
            --repository-name "$NGINX_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG"

          echo "========================================"
          echo "All images successfully pushed to ECR"
          echo "========================================"


  # ============================================================
  # JOB 2 - DEPLOY TO EC2
  # ============================================================

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    needs:
      - build-and-push

    steps:

      - name: Deploy application to EC2
        uses: appleboy/ssh-action@v1.0.3

        env:
          IMAGE_TAG: ${{ github.sha }}

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22

          envs: IMAGE_TAG

          script: |

            set -e

            # ==================================================
            # VARIABLES
            # ==================================================

            SHORT_TAG="${IMAGE_TAG:0:7}"

            AWS_REGION="us-east-1"

            ECR_REGISTRY="995938832906.dkr.ecr.us-east-1.amazonaws.com"

            BACKEND_IMAGE="$ECR_REGISTRY/swiggy-backend-v2:$SHORT_TAG"
            FRONTEND_IMAGE="$ECR_REGISTRY/swiggy-frontend:$SHORT_TAG"
            NGINX_IMAGE="$ECR_REGISTRY/swiggy-nginx-v2:$SHORT_TAG"

            # ==================================================
            # START
            # ==================================================

            echo "========================================"
            echo "Starting ZEDA deployment"
            echo "========================================"

            echo "Commit:"
            echo "$SHORT_TAG"

            echo ""
            echo "Backend:"
            echo "$BACKEND_IMAGE"

            echo ""
            echo "Frontend:"
            echo "$FRONTEND_IMAGE"

            echo ""
            echo "Nginx:"
            echo "$NGINX_IMAGE"

            echo "========================================"

            # ==================================================
            # APPLICATION DIRECTORY
            # ==================================================

            cd /opt/zeda

            echo "Current directory:"
            pwd

            # ==================================================
            # LOGIN TO ECR
            # ==================================================

            echo "Logging into Amazon ECR..."

            aws ecr get-login-password \
              --region "$AWS_REGION" | \
              docker login \
              --username AWS \
              --password-stdin "$ECR_REGISTRY"

            echo "ECR login successful"

            # ==================================================
            # CREATE DEPLOYMENT ENVIRONMENT
            # ==================================================

            cat > .env <<EOF
            BACKEND_IMAGE=$BACKEND_IMAGE
            FRONTEND_IMAGE=$FRONTEND_IMAGE
            NGINX_IMAGE=$NGINX_IMAGE
            EOF

            echo "Deployment .env created"

            cat .env

            # ==================================================
            # SHOW COMPOSE CONFIGURATION
            # ==================================================

            echo "========================================"
            echo "Docker Compose configuration"
            echo "========================================"

            docker-compose config | grep image

            # ==================================================
            # PULL NEW IMAGES
            # ==================================================

            echo "========================================"
            echo "Pulling new images"
            echo "========================================"

            docker-compose pull

            # ==================================================
            # DEPLOY
            # ==================================================

            echo "========================================"
            echo "Starting containers"
            echo "========================================"

            docker-compose up -d \
              --remove-orphans \
              --force-recreate

            # ==================================================
            # WAIT
            # ==================================================

            echo "========================================"
            echo "Waiting for health checks..."
            echo "========================================"

            sleep 20

            # ==================================================
            # SHOW CONTAINERS
            # ==================================================

            docker-compose ps

            # ==================================================
            # BACKEND HEALTH
            # ==================================================

            echo "========================================"
            echo "Checking backend health"
            echo "========================================"

            BACKEND_CONTAINER=$(docker-compose ps -q backend)

            if [ -z "$BACKEND_CONTAINER" ]; then
              echo "Backend container not found"
              docker-compose logs --tail=100 backend
              exit 1
            fi

            BACKEND_STATUS=$(docker inspect "$BACKEND_CONTAINER" \
              --format='{{.State.Health.Status}}')

            echo "Backend status: $BACKEND_STATUS"

            if [ "$BACKEND_STATUS" != "healthy" ]; then
              echo "Backend deployment failed"

              docker-compose logs --tail=100 backend

              exit 1
            fi

            echo "Backend healthy"

            # ==================================================
            # FRONTEND HEALTH
            # ==================================================

            echo "========================================"
            echo "Checking frontend health"
            echo "========================================"

            FRONTEND_CONTAINER=$(docker-compose ps -q frontend)

            if [ -z "$FRONTEND_CONTAINER" ]; then
              echo "Frontend container not found"
              docker-compose logs --tail=100 frontend
              exit 1
            fi

            FRONTEND_STATUS=$(docker inspect "$FRONTEND_CONTAINER" \
              --format='{{.State.Health.Status}}')

            echo "Frontend status: $FRONTEND_STATUS"

            if [ "$FRONTEND_STATUS" != "healthy" ]; then
              echo "Frontend deployment failed"

              docker-compose logs --tail=100 frontend

              exit 1
            fi

            echo "Frontend healthy"

            # ==================================================
            # NGINX HEALTH
            # ==================================================

            echo "========================================"
            echo "Checking nginx health"
            echo "========================================"

            NGINX_CONTAINER=$(docker-compose ps -q nginx)

            if [ -z "$NGINX_CONTAINER" ]; then
              echo "Nginx container not found"
              docker-compose logs --tail=100 nginx
              exit 1
            fi

            NGINX_STATUS=$(docker inspect "$NGINX_CONTAINER" \
              --format='{{.State.Health.Status}}')

            echo "Nginx status: $NGINX_STATUS"

            if [ "$NGINX_STATUS" != "healthy" ]; then
              echo "Nginx deployment failed"

              docker-compose logs --tail=100 nginx

              exit 1
            fi

            echo "Nginx healthy"

            # ==================================================
            # APPLICATION TEST
            # ==================================================

            echo "========================================"
            echo "Testing application"
            echo "========================================"

            echo "Testing backend through nginx..."

            curl -f \
              http://localhost/api/health

            echo ""

            echo "Application test successful"

            # ==================================================
            # FINAL STATUS
            # ==================================================

            echo ""
            echo "========================================"
            echo "ZEDA DEPLOYMENT SUCCESSFUL"
            echo "========================================"

            echo "Version:"
            echo "$SHORT_TAG"

            echo "Backend:"
            echo "$BACKEND_IMAGE"

            echo "Frontend:"
            echo "$FRONTEND_IMAGE"

            echo "Nginx:"
            echo "$NGINX_IMAGE"

            echo "========================================"
