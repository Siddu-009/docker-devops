
name: ZEDA Docker CI/CD

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 995938832906.dkr.ecr.us-east-1.amazonaws.com

  BACKEND_REPOSITORY: swiggy-backend-v2
  FRONTEND_REPOSITORY: swiggy-frontend
  NGINX_REPOSITORY: swiggy-nginx-v2

jobs:

  # ============================================================
  # JOB 1 - BUILD AND PUSH IMAGES TO ECR
  # ============================================================

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------

      - name: Checkout source code
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Configure AWS
      # ----------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ----------------------------------------------------------
      # Login to ECR
      # ----------------------------------------------------------

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ----------------------------------------------------------
      # Create image tag
      # ----------------------------------------------------------

      - name: Set image tag
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"

          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

          echo "========================================"
          echo "Image tag: $IMAGE_TAG"
          echo "========================================"

      # ----------------------------------------------------------
      # Build Backend
      # ----------------------------------------------------------

      - name: Build Backend Image
        run: |
          echo "Building backend image..."

          docker build \
            -t "$ECR_REGISTRY/$BACKEND_REPOSITORY:$IMAGE_TAG" \
            ./backend

      # ----------------------------------------------------------
      # Build Frontend
      # ----------------------------------------------------------

      - name: Build Frontend Image
        run: |
          echo "Building frontend image..."

          docker build \
            -t "$ECR_REGISTRY/$FRONTEND_REPOSITORY:$IMAGE_TAG" \
            ./frontend

      # ----------------------------------------------------------
      # Build Nginx
      # ----------------------------------------------------------

      - name: Build Nginx Image
        run: |
          echo "Building nginx image..."

          docker build \
            -t "$ECR_REGISTRY/$NGINX_REPOSITORY:$IMAGE_TAG" \
            ./nginx

      # ----------------------------------------------------------
      # Push Backend
      # ----------------------------------------------------------

      - name: Push Backend Image
        run: |
          echo "Pushing backend image..."

          docker push \
            "$ECR_REGISTRY/$BACKEND_REPOSITORY:$IMAGE_TAG"

      # ----------------------------------------------------------
      # Push Frontend
      # ----------------------------------------------------------

      - name: Push Frontend Image
        run: |
          echo "Pushing frontend image..."

          docker push \
            "$ECR_REGISTRY/$FRONTEND_REPOSITORY:$IMAGE_TAG"

      # ----------------------------------------------------------
      # Push Nginx
      # ----------------------------------------------------------

      - name: Push Nginx Image
        run: |
          echo "Pushing nginx image..."

          docker push \
            "$ECR_REGISTRY/$NGINX_REPOSITORY:$IMAGE_TAG"

      # ----------------------------------------------------------
      # Verify images
      # ----------------------------------------------------------

      - name: Verify images in ECR
        run: |
          echo "========================================"
          echo "Verifying ECR images"
          echo "========================================"

          aws ecr describe-images \
            --repository-name "$BACKEND_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG"

          aws ecr describe-images \
            --repository-name "$FRONTEND_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG"

          aws ecr describe-images \
            --repository-name "$NGINX_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG"

          echo "========================================"
          echo "All images successfully pushed to ECR"
          echo "========================================"


  # ============================================================
  # JOB 2 - DEPLOY TO EC2
  # ============================================================
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    needs:
      - build-and-push

    steps:

      - name: Deploy application to EC2
        uses: appleboy/ssh-action@v1.0.3

        env:
          IMAGE_TAG: ${{ github.sha }}

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          envs: IMAGE_TAG

          script: |

            set -e

            SHORT_TAG="${IMAGE_TAG:0:7}"

            AWS_REGION="us-east-1"

            ECR_REGISTRY="995938832906.dkr.ecr.us-east-1.amazonaws.com"

            BACKEND_IMAGE="$ECR_REGISTRY/swiggy-backend-v2:$SHORT_TAG"
            FRONTEND_IMAGE="$ECR_REGISTRY/swiggy-frontend:$SHORT_TAG"
            NGINX_IMAGE="$ECR_REGISTRY/swiggy-nginx-v2:$SHORT_TAG"

            echo "========================================"
            echo "Starting ZEDA deployment"
            echo "========================================"

            echo "Commit: $SHORT_TAG"
            echo "Backend: $BACKEND_IMAGE"
            echo "Frontend: $FRONTEND_IMAGE"
            echo "Nginx: $NGINX_IMAGE"

            cd /opt/zeda

            echo "========================================"
            echo "Docker versions"
            echo "========================================"

            docker --version
            docker compose version

            echo "========================================"
            echo "Logging into ECR"
            echo "========================================"

            aws ecr get-login-password \
              --region "$AWS_REGION" | \
              docker login \
              --username AWS \
              --password-stdin "$ECR_REGISTRY"

            echo "ECR login successful"

            echo "========================================"
            echo "Creating deployment environment"
            echo "========================================"

            cat > .env <<EOF
            BACKEND_IMAGE=$BACKEND_IMAGE
            FRONTEND_IMAGE=$FRONTEND_IMAGE
            NGINX_IMAGE=$NGINX_IMAGE
            EOF

            cat .env

            echo "========================================"
            echo "Compose configuration"
            echo "========================================"

            docker compose config | grep image

            echo "========================================"
            echo "Pulling new ECR images"
            echo "========================================"

            docker compose pull

            echo "========================================"
            echo "Starting containers"
            echo "========================================"

            docker compose up -d \
              --remove-orphans \
              --force-recreate

            echo "========================================"
            echo "Waiting for health checks"
            echo "========================================"

            sleep 20

            docker compose ps

            echo "========================================"
            echo "Checking backend"
            echo "========================================"

            BACKEND_CONTAINER=$(docker compose ps -q backend)

            BACKEND_STATUS=$(docker inspect "$BACKEND_CONTAINER" \
              --format='{{.State.Health.Status}}')

            echo "Backend status: $BACKEND_STATUS"

            if [ "$BACKEND_STATUS" != "healthy" ]; then
              echo "Backend deployment failed"
              docker compose logs --tail=100 backend
              exit 1
            fi

            echo "Backend healthy"

            echo "========================================"
            echo "Checking frontend"
            echo "========================================"

            FRONTEND_CONTAINER=$(docker compose ps -q frontend)

            FRONTEND_STATUS=$(docker inspect "$FRONTEND_CONTAINER" \
              --format='{{.State.Health.Status}}')

            echo "Frontend status: $FRONTEND_STATUS"

            if [ "$FRONTEND_STATUS" != "healthy" ]; then
              echo "Frontend deployment failed"
              docker compose logs --tail=100 frontend
              exit 1
            fi

            echo "Frontend healthy"

            echo "========================================"
            echo "Checking nginx"
            echo "========================================"

            NGINX_CONTAINER=$(docker compose ps -q nginx)

            NGINX_STATUS=$(docker inspect "$NGINX_CONTAINER" \
              --format='{{.State.Health.Status}}')

            echo "Nginx status: $NGINX_STATUS"

            if [ "$NGINX_STATUS" != "healthy" ]; then
              echo "Nginx deployment failed"
              docker compose logs --tail=100 nginx
              exit 1
            fi

            echo "Nginx healthy"

            echo "========================================"
            echo "Testing application"
            echo "========================================"

            curl -f http://localhost/api/health

            echo ""

            echo "========================================"
            echo "ZEDA DEPLOYMENT SUCCESSFUL"
            echo "========================================"

            echo "Version: $SHORT_TAG"
