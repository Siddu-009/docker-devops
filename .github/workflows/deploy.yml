name: ZEDA Docker CI/CD

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 995938832906.dkr.ecr.us-east-1.amazonaws.com

  BACKEND_REPOSITORY: swiggy-backend-v2
  FRONTEND_REPOSITORY: swiggy-frontend
  NGINX_REPOSITORY: swiggy-nginx-v2

jobs:

  # ============================================================
  # BUILD AND PUSH IMAGES
  # ============================================================

  build-and-push:

    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      image_tag: ${{ steps.image-tag.outputs.image_tag }}

    steps:

      # --------------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------------

      - name: Checkout source code
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # CONFIGURE AWS
      # --------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------------
      # VERIFY AWS
      # --------------------------------------------------------

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # --------------------------------------------------------
      # VERIFY ECR REPOSITORIES
      # --------------------------------------------------------

      - name: Verify ECR repositories
        run: |
          aws ecr describe-repositories \
            --repository-names "$BACKEND_REPOSITORY" \
            --region "$AWS_REGION"

          aws ecr describe-repositories \
            --repository-names "$FRONTEND_REPOSITORY" \
            --region "$AWS_REGION"

          aws ecr describe-repositories \
            --repository-names "$NGINX_REPOSITORY" \
            --region "$AWS_REGION"

      # --------------------------------------------------------
      # LOGIN TO ECR
      # --------------------------------------------------------

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # --------------------------------------------------------
      # IMAGE TAG
      # --------------------------------------------------------

      - name: Set image tag
        id: image-tag
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"

          echo "IMAGE_TAG=$IMAGE_TAG"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------
      # BUILD BACKEND
      # --------------------------------------------------------

      - name: Build Backend
        run: |
          echo "Building backend..."

          docker build \
            -t "$ECR_REGISTRY/$BACKEND_REPOSITORY:${{ steps.image-tag.outputs.image_tag }}" \
            ./backend

      # --------------------------------------------------------
      # BUILD FRONTEND
      # --------------------------------------------------------

      - name: Build Frontend
        run: |
          echo "Building frontend..."

          docker build \
            -t "$ECR_REGISTRY/$FRONTEND_REPOSITORY:${{ steps.image-tag.outputs.image_tag }}" \
            ./frontend

      # --------------------------------------------------------
      # BUILD NGINX
      # --------------------------------------------------------

      - name: Build Nginx
        run: |
          echo "Building nginx..."

          docker build \
            -t "$ECR_REGISTRY/$NGINX_REPOSITORY:${{ steps.image-tag.outputs.image_tag }}" \
            ./nginx

      # --------------------------------------------------------
      # SHOW LOCAL IMAGES
      # --------------------------------------------------------

      - name: Show built images
        run: |
          docker images | grep "$ECR_REGISTRY"

      # --------------------------------------------------------
      # PUSH BACKEND
      # --------------------------------------------------------

      - name: Push Backend to ECR
        run: |
          IMAGE="$ECR_REGISTRY/$BACKEND_REPOSITORY:${{ steps.image-tag.outputs.image_tag }}"

          echo "Pushing:"
          echo "$IMAGE"

          docker push "$IMAGE"

      # --------------------------------------------------------
      # PUSH FRONTEND
      # --------------------------------------------------------

      - name: Push Frontend to ECR
        run: |
          IMAGE="$ECR_REGISTRY/$FRONTEND_REPOSITORY:${{ steps.image-tag.outputs.image_tag }}"

          echo "Pushing:"
          echo "$IMAGE"

          docker push "$IMAGE"

      # --------------------------------------------------------
      # PUSH NGINX
      # --------------------------------------------------------

      - name: Push Nginx to ECR
        run: |
          IMAGE="$ECR_REGISTRY/$NGINX_REPOSITORY:${{ steps.image-tag.outputs.image_tag }}"

          echo "Pushing:"
          echo "$IMAGE"

          docker push "$IMAGE"

      # --------------------------------------------------------
      # VERIFY IMAGES IN ECR
      # --------------------------------------------------------

      - name: Verify images in ECR
        run: |

          TAG="${{ steps.image-tag.outputs.image_tag }}"

          echo "========================================"
          echo "Checking Backend ECR"
          echo "========================================"

          aws ecr describe-images \
            --repository-name "$BACKEND_REPOSITORY" \
            --image-ids imageTag="$TAG" \
            --region "$AWS_REGION"

          echo "========================================"
          echo "Checking Frontend ECR"
          echo "========================================"

          aws ecr describe-images \
            --repository-name "$FRONTEND_REPOSITORY" \
            --image-ids imageTag="$TAG" \
            --region "$AWS_REGION"

          echo "========================================"
          echo "Checking Nginx ECR"
          echo "========================================"

          aws ecr describe-images \
            --repository-name "$NGINX_REPOSITORY" \
            --image-ids imageTag="$TAG" \
            --region "$AWS_REGION"

          echo "========================================"
          echo "ALL 3 IMAGES EXIST IN ECR"
          echo "TAG: $TAG"
          echo "========================================"


  # ============================================================
  # DEPLOY TO EC2
  # ============================================================

  deploy:

    name: Deploy to EC2
    runs-on: ubuntu-latest

    needs:
      - build-and-push

    steps:

      - name: Deploy application to EC2

        uses: appleboy/ssh-action@v1.0.3

        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}

        with:

          host: ${{ secrets.EC2_HOST }}

          username: ${{ secrets.EC2_USER }}

          key: ${{ secrets.EC2_SSH_KEY }}

          port: 22

          envs: IMAGE_TAG

          script: |

            set -e

            echo "========================================"
            echo "Starting ZEDA deployment"
            echo "========================================"

            cd /opt/zeda

            echo "IMAGE_TAG received:"
            echo "$IMAGE_TAG"

            if [ -z "$IMAGE_TAG" ]; then
              echo "ERROR: IMAGE_TAG is empty"
              exit 1
            fi

            SHORT_TAG="$IMAGE_TAG"

            echo "Deploying tag:"
            echo "$SHORT_TAG"

            # ------------------------------------------------
            # ECR LOGIN
            # ------------------------------------------------

            echo "========================================"
            echo "Logging into Amazon ECR"
            echo "========================================"

            aws ecr get-login-password \
              --region us-east-1 | \
              docker login \
              --username AWS \
              --password-stdin \
              995938832906.dkr.ecr.us-east-1.amazonaws.com

            # ------------------------------------------------
            # SET IMAGE VARIABLES
            # ------------------------------------------------

            export BACKEND_IMAGE="995938832906.dkr.ecr.us-east-1.amazonaws.com/swiggy-backend-v2:${SHORT_TAG}"

            export FRONTEND_IMAGE="995938832906.dkr.ecr.us-east-1.amazonaws.com/swiggy-frontend:${SHORT_TAG}"

            export NGINX_IMAGE="995938832906.dkr.ecr.us-east-1.amazonaws.com/swiggy-nginx-v2:${SHORT_TAG}"

            echo "========================================"
            echo "Images to deploy"
            echo "========================================"

            echo "Backend:"
            echo "$BACKEND_IMAGE"

            echo "Frontend:"
            echo "$FRONTEND_IMAGE"

            echo "Nginx:"
            echo "$NGINX_IMAGE"

            # ------------------------------------------------
            # VERIFY IMAGES EXIST IN ECR
            # ------------------------------------------------

            echo "========================================"
            echo "Verifying images in ECR"
            echo "========================================"

            aws ecr describe-images \
              --repository-name swiggy-backend-v2 \
              --image-ids imageTag="$SHORT_TAG" \
              --region us-east-1

            aws ecr describe-images \
              --repository-name swiggy-frontend \
              --image-ids imageTag="$SHORT_TAG" \
              --region us-east-1

            aws ecr describe-images \
              --repository-name swiggy-nginx-v2 \
              --image-ids imageTag="$SHORT_TAG" \
              --region us-east-1

            echo "ECR verification successful"

            # ------------------------------------------------
            # VERIFY COMPOSE
            # ------------------------------------------------

            echo "========================================"
            echo "Docker Compose configuration"
            echo "========================================"

            docker compose config | grep image

            # ------------------------------------------------
            # PULL IMAGES
            # ------------------------------------------------

            echo "========================================"
            echo "Pulling images"
            echo "========================================"

            docker compose pull

            # ------------------------------------------------
            # STOP OLD CONTAINERS
            # ------------------------------------------------

            echo "========================================"
            echo "Stopping old containers"
            echo "========================================"

            docker compose down --remove-orphans

            # ------------------------------------------------
            # START NEW CONTAINERS
            # ------------------------------------------------

            echo "========================================"
            echo "Starting new containers"
            echo "========================================"

            docker compose up -d \
              --remove-orphans \
              --force-recreate

            # ------------------------------------------------
            # WAIT
            # ------------------------------------------------

            echo "========================================"
            echo "Waiting for health checks"
            echo "========================================"

            MAX_WAIT=120
            WAITED=0

            while true; do

              BACKEND_CONTAINER=$(docker compose ps -q backend)
              FRONTEND_CONTAINER=$(docker compose ps -q frontend)
              NGINX_CONTAINER=$(docker compose ps -q nginx)

              if [ -z "$BACKEND_CONTAINER" ]; then
                echo "Backend container not found"
                docker compose logs --tail=100 backend
                exit 1
              fi

              if [ -z "$FRONTEND_CONTAINER" ]; then
                echo "Frontend container not found"
                docker compose logs --tail=100 frontend
                exit 1
              fi

              if [ -z "$NGINX_CONTAINER" ]; then
                echo "Nginx container not found"
                docker compose logs --tail=100 nginx
                exit 1
              fi

              BACKEND_STATUS=$(docker inspect "$BACKEND_CONTAINER" \
                --format='{{.State.Health.Status}}')

              FRONTEND_STATUS=$(docker inspect "$FRONTEND_CONTAINER" \
                --format='{{.State.Health.Status}}')

              NGINX_STATUS=$(docker inspect "$NGINX_CONTAINER" \
                --format='{{.State.Health.Status}}')

              echo "----------------------------------------"
              echo "Backend : $BACKEND_STATUS"
              echo "Frontend: $FRONTEND_STATUS"
              echo "Nginx   : $NGINX_STATUS"
              echo "Waited  : ${WAITED}s"
              echo "----------------------------------------"

              if [ "$BACKEND_STATUS" = "unhealthy" ]; then
                echo "Backend unhealthy"
                docker compose logs --tail=100 backend
                exit 1
              fi

              if [ "$FRONTEND_STATUS" = "unhealthy" ]; then
                echo "Frontend unhealthy"
                docker compose logs --tail=100 frontend
                exit 1
              fi

              if [ "$NGINX_STATUS" = "unhealthy" ]; then
                echo "Nginx unhealthy"
                docker compose logs --tail=100 nginx
                exit 1
              fi

              if [ "$BACKEND_STATUS" = "healthy" ] && \
                 [ "$FRONTEND_STATUS" = "healthy" ] && \
                 [ "$NGINX_STATUS" = "healthy" ]; then

                echo "========================================"
                echo "ALL CONTAINERS HEALTHY"
                echo "========================================"

                break
              fi

              if [ "$WAITED" -ge "$MAX_WAIT" ]; then

                echo "Health check timeout"

                docker compose ps

                docker compose logs --tail=100 backend
                docker compose logs --tail=100 frontend
                docker compose logs --tail=100 nginx

                exit 1
              fi

              sleep 5

              WAITED=$((WAITED + 5))

            done

            # ------------------------------------------------
            # TEST BACKEND
            # ------------------------------------------------

            echo "========================================"
            echo "Testing backend"
            echo "========================================"

            curl -f http://localhost/api/health

            echo ""

            # ------------------------------------------------
            # TEST FRONTEND
            # ------------------------------------------------

            echo "========================================"
            echo "Testing frontend"
            echo "========================================"

            curl -f http://localhost/

            echo ""

            # ------------------------------------------------
            # FINAL
            # ------------------------------------------------

            echo "========================================"
            echo "ZEDA DEPLOYMENT SUCCESSFUL"
            echo "========================================"

            echo "Backend : $BACKEND_IMAGE"
            echo "Frontend: $FRONTEND_IMAGE"
            echo "Nginx   : $NGINX_IMAGE"

            echo "========================================"
