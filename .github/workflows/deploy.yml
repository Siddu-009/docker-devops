name: ZEDA Docker CI/CD

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 995938832906.dkr.ecr.us-east-1.amazonaws.com

  BACKEND_REPOSITORY: swiggy-backend-v2
  FRONTEND_REPOSITORY: swiggy-frontend
  NGINX_REPOSITORY: swiggy-nginx-v2

jobs:

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build Backend
        run: |
          docker build \
            -t $ECR_REGISTRY/$BACKEND_REPOSITORY:$IMAGE_TAG \
            ./backend

      - name: Build Frontend
        run: |
          docker build \
            -t $ECR_REGISTRY/$FRONTEND_REPOSITORY:$IMAGE_TAG \
            ./frontend

      - name: Build Nginx
        run: |
          docker build \
            -t $ECR_REGISTRY/$NGINX_REPOSITORY:$IMAGE_TAG \
            ./nginx

      - name: Push Backend
        run: |
          docker push \
            $ECR_REGISTRY/$BACKEND_REPOSITORY:$IMAGE_TAG

      - name: Push Frontend
        run: |
          docker push \
            $ECR_REGISTRY/$FRONTEND_REPOSITORY:$IMAGE_TAG

      - name: Push Nginx
        run: |
          docker push \
            $ECR_REGISTRY/$NGINX_REPOSITORY:$IMAGE_TAG


  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    needs: build-and-push

    steps:

      - name: Deploy application
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          envs: IMAGE_TAG

          script: |

            set -e

            cd /opt/zeda

            echo "Deploying image tag: ${IMAGE_TAG:0:7}"

            aws ecr get-login-password \
              --region us-east-1 | \
              docker login \
              --username AWS \
              --password-stdin \
              995938832906.dkr.ecr.us-east-1.amazonaws.com

            export BACKEND_IMAGE=995938832906.dkr.ecr.us-east-1.amazonaws.com/swiggy-backend-v2:${IMAGE_TAG:0:7}

            export FRONTEND_IMAGE=995938832906.dkr.ecr.us-east-1.amazonaws.com/swiggy-frontend:${IMAGE_TAG:0:7}

            export NGINX_IMAGE=995938832906.dkr.ecr.us-east-1.amazonaws.com/swiggy-nginx-v2:${IMAGE_TAG:0:7}

            docker-compose pull

            docker-compose up -d --remove-orphans

            echo "Waiting for containers..."

            sleep 20

            docker-compose ps

            echo "Checking backend health..."

            BACKEND_STATUS=$(docker inspect zeda-backend \
              --format='{{.State.Health.Status}}')

            echo "Backend: $BACKEND_STATUS"

            if [ "$BACKEND_STATUS" != "healthy" ]; then
              echo "Backend deployment failed"
              docker-compose logs backend
              exit 1
            fi

            echo "Checking frontend health..."

            FRONTEND_STATUS=$(docker inspect zeda-frontend \
              --format='{{.State.Health.Status}}')

            echo "Frontend: $FRONTEND_STATUS"

            if [ "$FRONTEND_STATUS" != "healthy" ]; then
              echo "Frontend deployment failed"
              docker-compose logs frontend
              exit 1
            fi

            echo "Checking nginx health..."

            NGINX_STATUS=$(docker inspect zeda-nginx \
              --format='{{.State.Health.Status}}')

            echo "Nginx: $NGINX_STATUS"

            if [ "$NGINX_STATUS" != "healthy" ]; then
              echo "Nginx deployment failed"
              docker-compose logs nginx
              exit 1
            fi

            echo "================================"
            echo "ZEDA deployment successful!"
            echo "================================"
