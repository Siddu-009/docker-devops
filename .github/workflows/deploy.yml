name: ZEDA Docker CI/CD

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 995938832906.dkr.ecr.us-east-1.amazonaws.com

  BACKEND_REPOSITORY: swiggy-backend-v2
  FRONTEND_REPOSITORY: swiggy-frontend
  NGINX_REPOSITORY: swiggy-nginx-v2

jobs:

  # ============================================================
  # BUILD AND PUSH
  # ============================================================

  build-and-push:

    name: Build and Push Docker Images

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # AWS
      # --------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------------
      # ECR LOGIN
      # --------------------------------------------------------

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # --------------------------------------------------------
      # IMAGE TAG
      # --------------------------------------------------------

      - name: Set image tag
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "Building images with tag: $IMAGE_TAG"

      # --------------------------------------------------------
      # BUILD BACKEND
      # --------------------------------------------------------

      - name: Build Backend
        run: |
          docker build \
            -t "$ECR_REGISTRY/$BACKEND_REPOSITORY:$IMAGE_TAG" \
            ./backend

      # --------------------------------------------------------
      # BUILD FRONTEND
      # --------------------------------------------------------

      - name: Build Frontend
        run: |
          docker build \
            -t "$ECR_REGISTRY/$FRONTEND_REPOSITORY:$IMAGE_TAG" \
            ./frontend

      # --------------------------------------------------------
      # BUILD NGINX
      # --------------------------------------------------------

      - name: Build Nginx
        run: |
          docker build \
            -t "$ECR_REGISTRY/$NGINX_REPOSITORY:$IMAGE_TAG" \
            ./nginx

      # --------------------------------------------------------
      # PUSH BACKEND
      # --------------------------------------------------------

      - name: Push Backend
        run: |
          docker push \
            "$ECR_REGISTRY/$BACKEND_REPOSITORY:$IMAGE_TAG"

      # --------------------------------------------------------
      # PUSH FRONTEND
      # --------------------------------------------------------

      - name: Push Frontend
        run: |
          docker push \
            "$ECR_REGISTRY/$FRONTEND_REPOSITORY:$IMAGE_TAG"

      # --------------------------------------------------------
      # PUSH NGINX
      # --------------------------------------------------------

      - name: Push Nginx
        run: |
          docker push \
            "$ECR_REGISTRY/$NGINX_REPOSITORY:$IMAGE_TAG"

      # --------------------------------------------------------
      # VERIFY
      # --------------------------------------------------------

      - name: Deployment image summary
        run: |
          echo "========================================"
          echo "Images pushed successfully"
          echo "========================================"
          echo "Backend : $ECR_REGISTRY/$BACKEND_REPOSITORY:$IMAGE_TAG"
          echo "Frontend: $ECR_REGISTRY/$FRONTEND_REPOSITORY:$IMAGE_TAG"
          echo "Nginx   : $ECR_REGISTRY/$NGINX_REPOSITORY:$IMAGE_TAG"
          echo "========================================"


  # ============================================================
  # DEPLOY TO EC2
  # ============================================================

  deploy:

    name: Deploy to EC2

    runs-on: ubuntu-latest

    needs:
      - build-and-push

    steps:

      - name: Deploy application to EC2
        uses: appleboy/ssh-action@v1.0.3

        env:
          IMAGE_TAG: ${{ github.sha }}

        with:

          host: ${{ secrets.EC2_HOST }}

          username: ${{ secrets.EC2_USER }}

          key: ${{ secrets.EC2_SSH_KEY }}

          port: 22

          envs: IMAGE_TAG

